# Some portions were copied from insights-ingress-go and playbook-dispatcher
version: "3"
services:
  zookeeper:
    image: confluentinc/cp-zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=32181
      - ZOOKEEPER_SERVER_ID=1

  kafka:
    # TODO: migrate from Zookeeper to KRaft
    image: confluentinc/cp-kafka:7.9.2
    ports:
      - '29092:29092'
    depends_on:
      - zookeeper
    environment:
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_BROKER_ID=1
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:32181
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true

  s3:
    # MinIO no longer publishes images on Docker Hub. moto is the same S3 emulator the
    # unit tests use. It keeps data in memory, so buckets and objects reset on restart.
    image: motoserver/moto:latest
    ports:
      - '9000:5000'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5000/moto-api/"]
      interval: 5s
      timeout: 5s
      retries: 12

  s3-createbuckets:
    image: motoserver/moto:latest
    depends_on:
      s3:
        condition: service_healthy
    restart: on-failure
    # moto accepts unsigned requests, so plain PUTs create the buckets.
    # Each step must succeed, so a failure exits non-zero instead of being skipped silently.
    entrypoint: >
      /bin/sh -c "
      curl -fsS -X PUT http://s3:5000/insights-upload-perma &&
      curl -fsS -X PUT http://s3:5000/insights-upload-rejected
      "

  ingress:
    image: quay.io/cloudservices/insights-ingress:latest
    ports:
      - '3000:3000'
    environment:
      - INGRESS_KAFKABROKERS=kafka:9092
      - INGRESS_STAGEBUCKET=insights-upload-perma
      - INGRESS_VALIDTOPICS=announce
      - OPENSHIFT_BUILD_COMMIT=somestring
      - INGRESS_MAXSIZE=104857600
      - INGRESS_MINIODEV=true
      - INGRESS_MINIOACCESSKEY=$MINIO_ACCESS_KEY
      - INGRESS_MINIOSECRETKEY=$MINIO_SECRET_KEY
      - INGRESS_MINIOENDPOINT=s3:5000
    depends_on:
      kafka:
        condition: service_started
      s3-createbuckets:
        condition: service_completed_successfully
